name: PR Review

on:
  # pull_request_target: runs on OUR repo (workflow from main) with secrets,
  # so fork PRs can be reviewed without a maintainer click.
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Skip drafts, and skip PRs authored by the repo owner (manual dispatch still works).
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'wslyvh'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber =
              context.eventName === "workflow_dispatch"
                ? Number("${{ inputs.pr_number }}")
                : context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.draft) {
              core.setFailed(`PR #${prNumber} is a draft — skipping review.`);
              return;
            }

            core.setOutput("number", String(pr.number));
            core.setOutput("head_repo", pr.head.repo.full_name);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);

      # Checkout PR head (may be a fork). Workflow YAML still comes from main —
      # we never execute untrusted scripts; agent may only Read + gh comment.
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Required for fork authors (read-only on this repo). Safe here because
          # tools are comment/read-only — no code push or arbitrary shell.
          allowed_non_write_users: "*"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            Scope: this PR only. Start with `gh pr view` + `gh pr diff`.
            You may Read files touched by the diff (or their direct callers) to
            verify a finding — do not Glob/Grep the whole repo.

            Focus: logic bugs, security, privacy (PII logging, secrets in code,
            unsafe SQL/IPC, leaking user/email data). Skip style and praise.

            Post exactly one `gh pr comment ${{ steps.pr.outputs.number }}`:
            - If fine: just `LGTM`
            - If not: short bullets only — `path:line — issue`

            Inline comments only for real bugs/security (confirmed: true).
            If a tool is denied, do not retry — finish with the summary comment.
          claude_args: |
            --effort medium
            --max-turns 20
            --allowedTools "Bash(gh:*),Read,mcp__github_inline_comment__create_inline_comment"
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_MODEL: anthropic/claude-sonnet-5
